<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Route Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Route Planner</h1>

  <section id="waypoints-section">
    <h2>Waypoints</h2>
    <div id="waypoints-list"></div>
    <button id="add-waypoint-btn">Add waypoint</button>
    <button id="build-route-btn">Build route</button>
  </section>
  
  <section id="climbs-section" style="display:none;">
    <h2>Reference climbs</h2>
    <div id="climbs-list"></div>
  </section>

  <section id="export-climb-section" style="display:none;">
  <h2>Save current route as climb</h2>
  <div style="display:flex; flex-direction:column; gap:0.5rem; max-width:300px;">
    <label>
      Climb name
      <input id="climb-name-input" type="text" placeholder="e.g. My Local Climb" style="width:100%; padding:0.4rem;" />
    </label>
    <label>
      Climb ID (optional)
      <input id="climb-id-input" type="text" placeholder="e.g. my_local_climb" style="width:100%; padding:0.4rem;" />
    </label>
    <button id="export-climb-btn" style="padding:0.4rem 0.6rem;">Download climb JSON</button>
  </div>
</section>

  <section id="import-climbs-section">
  <h2>Load climbs from JSON</h2>
  <input id="climbs-file-input" type="file" accept=".json,application/json" />
  <div id="import-status" style="margin-top:0.5rem; font-size:0.9rem;"></div>
</section>
  
  <section id="route-section" style="display:none;">
    <h2>Route</h2>
    <div id="map" style="height: 300px; width: 100%;"></div>
    <canvas id="elevation-chart" width="600" height="250"></canvas>
    <div id="summary"></div>
    <button id="edit-waypoints-btn">Edit waypoints</button>
  </section>

  <!-- Google Maps -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBiMYUtbIXA-5zal571orv0Juz8GUqzF0c"
    defer
  ></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
